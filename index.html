<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monitor Status</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f13;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 780px;
      width: 100%;
    }

    .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.8rem);
      font-weight: 700;
      line-height: 1.15;
      color: #f0f0f0;
      margin-bottom: 2.5rem;
    }

    .status-card {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: #1a1a22;
      border: 1px solid #2a2a38;
      border-radius: 999px;
      padding: 0.85rem 2rem;
      margin-bottom: 2.5rem;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #e53e3e;
      box-shadow: 0 0 0 0 rgba(229, 62, 62, 0.6);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(229, 62, 62, 0.6); }
      70%  { box-shadow: 0 0 0 10px rgba(229, 62, 62, 0); }
      100% { box-shadow: 0 0 0 0 rgba(229, 62, 62, 0); }
    }

    .status-label {
      font-size: 1rem;
      font-weight: 600;
      color: #e53e3e;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .description {
      font-size: 1rem;
      color: #555;
      line-height: 1.7;
      margin-bottom: 3rem;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: #2a2a38;
      margin: 0 auto 2.5rem;
      border-radius: 2px;
    }

    .meta {
      font-size: 0.78rem;
      color: #444;
      letter-spacing: 0.05em;
    }

    .meta span {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="eyebrow">System Status</p>
    <h1>Has the mysterious monitor been found?</h1>

    <div class="status-card">
      <div class="dot"></div>
      <span class="status-label">Not Found</span>
    </div>

    <div class="divider"></div>

    <p class="description">
      The mysterious monitor has not yet been located. Investigation is ongoing.<br/>
      This page will update automatically when the status changes.
    </p>

    <p class="meta">Last checked: <span>Just now</span> &nbsp;·&nbsp; Auto-refreshes every 60s</p>
  </div>

  <script>
    // Update the "last checked" time every minute
    const metaTime = document.querySelector('.meta span');
    function updateTime() {
      const now = new Date();
      metaTime.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateTime, 60000);
  </script>
</body>
</html>
